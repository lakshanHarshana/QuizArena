<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 640" width="100%" height="100%">
  <defs>
    <!-- Background & Cosmic Gradients -->
    <radialGradient id="arenaUniverseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.98" />
    </linearGradient>

    <linearGradient id="orbitBeam1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="timerProgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Filter Effects -->
    <filter id="glowFilt" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="badgeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <style>
      /* Main Float Animation */
      @keyframes floatUniverse {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      .universe-container {
        animation: floatUniverse 5s ease-in-out infinite;
      }

      /* Gyroscopic Background Rings */
      @keyframes spinCW {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spinCCW {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      .ring-clockwise {
        transform-origin: 370px 320px;
        animation: spinCW 30s linear infinite;
      }
      .ring-counter {
        transform-origin: 370px 320px;
        animation: spinCCW 24s linear infinite;
      }

      /* Center Halo & Lightning Pulse */
      @keyframes pulseAura {
        0%, 100% { transform: scale(1); opacity: 0.35; }
        50% { transform: scale(1.15); opacity: 0.65; }
      }
      .aura-glow {
        transform-origin: 370px 320px;
        animation: pulseAura 3.5s ease-in-out infinite;
      }
      @keyframes ringTick {
        0%, 100% { stroke-dashoffset: 80; }
        50% { stroke-dashoffset: 260; }
      }
      .timer-stroke-dyn {
        animation: ringTick 5s ease-in-out infinite alternate;
      }
      @keyframes boltPulse {
        0%, 100% { filter: drop-shadow(0 0 4px #fbbf24); }
        50% { filter: drop-shadow(0 0 14px #f59e0b); }
      }
      .bolt-glow {
        animation: boltPulse 2s ease-in-out infinite alternate;
      }

      /* ===================================================================
         ORBITAL ROTATION OF THE 4 DISCIPLINE CARDS
         The master group rotates 360deg around center (370px, 320px).
         Each card counter-rotates -360deg so its text stays upright!
         =================================================================== */
      @keyframes orbitRevolution {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes counterOrient {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(-360deg); }
      }

      .discipline-orbit-system {
        transform-origin: 370px 320px;
        animation: orbitRevolution 20s linear infinite;
      }
      .discipline-orbit-system:hover {
        animation-play-state: paused;
      }

      .keep-upright {
        animation: counterOrient 20s linear infinite;
      }
      .discipline-orbit-system:hover .keep-upright {
        animation-play-state: paused;
      }

      /* Center coordinates of each card slot for upright counter-rotation */
      .slot-top {
        transform-origin: 370px 80px;
      }
      .slot-right {
        transform-origin: 615px 320px;
      }
      .slot-bottom {
        transform-origin: 370px 560px;
      }
      .slot-left {
        transform-origin: 125px 320px;
      }

      /* ===================================================================
         SEQUENTIAL VISIBLE & INVISIBLE (FADE & GLOW PULSE) ANIMATIONS
         Each card smoothly illuminates, expands, and dims in rotation
         =================================================================== */
      @keyframes phasedVisibility {
        0% {
          opacity: 0.35;
          transform: scale(0.92);
        }
        25% {
          opacity: 1;
          transform: scale(1.08);
          filter: drop-shadow(0 0 16px rgba(99, 102, 241, 0.7));
        }
        50% {
          opacity: 0.4;
          transform: scale(0.94);
        }
        75% {
          opacity: 0.25;
          transform: scale(0.9);
        }
        100% {
          opacity: 0.35;
          transform: scale(0.92);
        }
      }

      .phase-card-1 {
        animation: phasedVisibility 10s ease-in-out infinite 0s;
      }
      .phase-card-2 {
        animation: phasedVisibility 10s ease-in-out infinite 2.5s;
      }
      .phase-card-3 {
        animation: phasedVisibility 10s ease-in-out infinite 5s;
      }
      .phase-card-4 {
        animation: phasedVisibility 10s ease-in-out infinite 7.5s;
      }

      /* Cursor & Interactive Hover Glow */
      .interactive-card {
        cursor: pointer;
        transition: transform 0.3s ease, filter 0.3s ease;
      }
      .interactive-card:hover {
        opacity: 1 !important;
        transform: scale(1.14) !important;
        filter: drop-shadow(0 0 22px rgba(255, 255, 255, 0.8)) !important;
      }
    </style>
  </defs>

  <!-- Ambient Radiant Halo -->
  <circle cx="370" cy="320" r="270" fill="url(#arenaUniverseGlow)" class="aura-glow" />

  <g class="universe-container">
    <!-- Outer Gyroscope Tech Ring (Clockwise) -->
    <g class="ring-clockwise">
      <circle cx="370" cy="320" r="240" fill="none" stroke="url(#orbitBeam1)" stroke-width="2.5" stroke-dasharray="16 14 36 14" />
      <circle cx="610" cy="320" r="5" fill="#38bdf8" filter="url(#glowFilt)" />
      <circle cx="130" cy="320" r="5" fill="#a855f7" filter="url(#glowFilt)" />
    </g>

    <!-- Inner Concentric Orbit (Counter-Clockwise) -->
    <g class="ring-counter">
      <circle cx="370" cy="320" r="195" fill="none" stroke="#6366f1" stroke-width="1.8" stroke-dasharray="10 10 24 10" stroke-opacity="0.6" />
      <circle cx="370" cy="125" r="4.5" fill="#10b981" filter="url(#glowFilt)" />
      <circle cx="370" cy="515" r="4.5" fill="#f59e0b" filter="url(#glowFilt)" />
    </g>

    <!-- Central Static Arena Shield & Knowledge Hub -->
    <g filter="url(#badgeShadow)">
      <!-- Octagonal Combat Shield -->
      <polygon points="370,190 465,228 500,320 465,412 370,450 275,412 240,320 275,228" 
               fill="url(#shieldGrad)" stroke="#6366f1" stroke-width="3" />

      <!-- Inner Holographic Ring -->
      <polygon points="370,205 452,238 482,320 452,402 370,435 288,402 258,320 288,238" 
               fill="#0a0f1d" fill-opacity="0.85" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="6 4" />

      <!-- Real-Time Dynamic Timer Arc -->
      <circle cx="370" cy="320" r="82" fill="none" stroke="#334155" stroke-width="6" />
      <circle cx="370" cy="320" r="82" fill="none" stroke="url(#timerProgGrad)" stroke-width="6" 
              stroke-linecap="round" stroke-dasharray="515" stroke-dashoffset="120" class="timer-stroke-dyn" />

      <!-- Core Knowledge Trophy & Arena Lightning -->
      <g transform="translate(370, 320)">
        <path d="M-28,-32 L28,-32 C28,0 18,22 0,28 C-18,22 -28,0 -28,-32 Z" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" />
        <path d="M-28,-22 C-40,-22 -40,5 -22,8" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" />
        <path d="M28,-22 C40,-22 40,5 22,8" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" />
        <path d="M-6,28 L6,28 L8,40 L-8,40 Z" fill="#6366f1" />
        <rect x="-18" y="40" width="36" height="8" rx="3" fill="#818cf8" />
        <polygon points="2,-24 -12,-4 0,-4 -2,16 12,-4 0,-4" fill="#fbbf24" class="bolt-glow" />
      </g>
    </g>

    <!-- ===================================================================
         ROTATING ORBITAL SYSTEM WITH VISIBLE / INVISIBLE FADE & HOVER
         =================================================================== -->
    <g class="discipline-orbit-system">
      <!-- ORBIT PATH GUIDE LINE -->
      <circle cx="370" cy="320" r="240" fill="none" stroke="#4f46e5" stroke-width="1" stroke-dasharray="4 8" stroke-opacity="0.35" />

      <!-- CARD 1: TOP (Technology & Computing) -->
      <!-- Center: (370, 80), Rect: x=275, y=50, width=190, height=60 -->
      <g class="keep-upright slot-top">
        <g class="phase-card-1 interactive-card" filter="url(#badgeShadow)">
          <rect x="275" y="50" width="190" height="60" rx="14" fill="#0f172a" stroke="#06b6d4" stroke-width="2" fill-opacity="0.96" />
          <circle cx="305" cy="80" r="16" fill="#06b6d4" fill-opacity="0.25" />
          <path d="M297,74 L313,74 M297,80 L313,80 M297,86 L313,86" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
          <circle cx="300" cy="74" r="2" fill="#38bdf8" />
          <circle cx="310" cy="86" r="2" fill="#38bdf8" />
          <text x="330" y="73" font-family="'Inter', -apple-system, sans-serif" font-size="10" font-weight="700" fill="#9ca3af" letter-spacing="0.5">TECHNOLOGY</text>
          <text x="330" y="93" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="800" fill="#38bdf8">Coding &amp; AI &amp; IT</text>
        </g>
      </g>

      <!-- CARD 2: RIGHT (Science & Mathematics) -->
      <!-- Center: (615, 320), Rect: x=520, y=290, width=190, height=60 -->
      <g class="keep-upright slot-right">
        <g class="phase-card-2 interactive-card" filter="url(#badgeShadow)">
          <rect x="520" y="290" width="190" height="60" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="2" fill-opacity="0.96" />
          <circle cx="550" cy="320" r="16" fill="#10b981" fill-opacity="0.25" />
          <ellipse cx="550" cy="320" rx="10" ry="4" fill="none" stroke="#34d399" stroke-width="1.5" transform="rotate(30 550 320)" />
          <ellipse cx="550" cy="320" rx="10" ry="4" fill="none" stroke="#34d399" stroke-width="1.5" transform="rotate(-30 550 320)" />
          <circle cx="550" cy="320" r="2.5" fill="#34d399" />
          <text x="575" y="313" font-family="'Inter', -apple-system, sans-serif" font-size="10" font-weight="700" fill="#9ca3af" letter-spacing="0.5">SCIENCE &amp; MATH</text>
          <text x="575" y="333" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="800" fill="#34d399">Physics, Bio &amp; Chem</text>
        </g>
      </g>

      <!-- CARD 3: BOTTOM (Arts & Humanities) -->
      <!-- Center: (370, 560), Rect: x=275, y=530, width=190, height=60 -->
      <g class="keep-upright slot-bottom">
        <g class="phase-card-3 interactive-card" filter="url(#badgeShadow)">
          <rect x="275" y="530" width="190" height="60" rx="14" fill="#0f172a" stroke="#ec4899" stroke-width="2" fill-opacity="0.96" />
          <circle cx="305" cy="560" r="16" fill="#ec4899" fill-opacity="0.25" />
          <path d="M297,564 C295,556 300,551 307,551 C312,551 315,554 314,558 C313,562 309,561 309,563 C309,565 311,565 310,567 C309,569 300,570 297,564 Z" fill="none" stroke="#f472b6" stroke-width="1.8" />
          <circle cx="303" cy="555" r="1.5" fill="#f472b6" />
          <circle cx="309" cy="556" r="1.5" fill="#f472b6" />
          <text x="330" y="553" font-family="'Inter', -apple-system, sans-serif" font-size="10" font-weight="700" fill="#9ca3af" letter-spacing="0.5">ARTS &amp; HUMANITIES</text>
          <text x="330" y="573" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="800" fill="#f472b6">Design, History &amp; Lit</text>
        </g>
      </g>

      <!-- CARD 4: LEFT (Multi-Domain & General) -->
      <!-- Center: (125, 320), Rect: x=30, y=290, width=190, height=60 -->
      <g class="keep-upright slot-left">
        <g class="phase-card-4 interactive-card" filter="url(#badgeShadow)">
          <rect x="30" y="290" width="190" height="60" rx="14" fill="#0f172a" stroke="#8b5cf6" stroke-width="2" fill-opacity="0.96" />
          <circle cx="60" cy="320" r="16" fill="#8b5cf6" fill-opacity="0.25" />
          <path d="M50,318 L60,313 L70,318 L60,323 Z" fill="none" stroke="#c084fc" stroke-width="1.8" />
          <path d="M53,320 L53,325 C53,327 60,330 67,325 L67,320" fill="none" stroke="#c084fc" stroke-width="1.5" />
          <text x="85" y="313" font-family="'Inter', -apple-system, sans-serif" font-size="10" font-weight="700" fill="#9ca3af" letter-spacing="0.5">MULTI-DOMAIN</text>
          <text x="85" y="333" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="800" fill="#c084fc">All Disciplines</text>
        </g>
      </g>
    </g>
  </g>
</svg>
