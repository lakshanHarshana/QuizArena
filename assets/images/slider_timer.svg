<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06121e" />
      <stop offset="50%" stop-color="#0b1e36" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="timerCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="timerWarn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" fill="url(#bgGrad2)" />

  <circle cx="200" cy="450" r="180" fill="#06b6d4" opacity="0.12" filter="url(#glow2)" />
  <circle cx="1000" cy="150" r="220" fill="#3b82f6" opacity="0.12" filter="url(#glow2)" />

  <!-- Left Content Column -->
  <g transform="translate(100, 140)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="230" height="36" rx="18" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4" stroke-width="1.5" />
    <text x="20" y="23" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#67e8f9">⏱ FEATURE HIGHLIGHT 02</text>

    <!-- Headline -->
    <text x="0" y="85" font-family="'Inter', sans-serif" font-size="44" font-weight="800" fill="#ffffff">Dual Synchronized Timers</text>
    <text x="0" y="130" font-family="'Inter', sans-serif" font-size="28" font-weight="700" fill="#38bdf8">&amp; Auto-Calculated Limits</text>

    <!-- Description -->
    <text x="0" y="185" font-family="'Inter', sans-serif" font-size="18" fill="#9ca3af">
      <tspan x="0" dy="0">Overall quiz duration is automatically calculated as</tspan>
      <tspan x="0" dy="28">the sum of individual question time limits. Both question</tspan>
      <tspan x="0" dy="28">countdown and overall master clock run with zero drift.</tspan>
    </text>

    <!-- Feature tags -->
    <g transform="translate(0, 275)">
      <rect x="0" y="0" width="140" height="34" rx="8" fill="#1f2937" stroke="#374151" />
      <text x="16" y="22" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#e5e7eb">∑ Auto SUM(Time)</text>

      <rect x="155" y="0" width="145" height="34" rx="8" fill="#1f2937" stroke="#374151" />
      <text x="171" y="22" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#e5e7eb">🚨 Zero-Time Auto Submit</text>

      <rect x="315" y="0" width="125" height="34" rx="8" fill="#1f2937" stroke="#374151" />
      <text x="331" y="22" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#e5e7eb">⚡ Pulse Warning</text>
    </g>
  </g>

  <!-- Right Visual Mockup (Timers & Progress) -->
  <g transform="translate(680, 100)">
    <rect x="0" y="0" width="440" height="400" rx="20" fill="#111827" stroke="#374151" stroke-width="1.5" />

    <!-- Overall Clock Card -->
    <g transform="translate(30, 30)">
      <rect x="0" y="0" width="380" height="150" rx="14" fill="#0b1329" stroke="#1e293b" />
      <text x="25" y="38" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#94a3b8">OVERALL QUIZ MASTER CLOCK</text>
      <text x="25" y="90" font-family="'Inter', sans-serif" font-size="46" font-weight="900" fill="#38bdf8" letter-spacing="2">04:42</text>
      <text x="200" y="90" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#64748b">/ 05:00 Total</text>

      <!-- Progress bar -->
      <rect x="25" y="115" width="330" height="10" rx="5" fill="#1e293b" />
      <rect x="25" y="115" width="280" height="10" rx="5" fill="url(#timerCyan)" />
    </g>

    <!-- Question Clock Card -->
    <g transform="translate(30, 205)">
      <rect x="0" y="0" width="380" height="165" rx="14" fill="#1c1917" stroke="#3b1d1d" />
      <div class="d-flex justify-content-between">
        <text x="25" y="38" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#f87171">QUESTION 3 COUNTDOWN (CRITICAL)</text>
      </div>
      <text x="25" y="92" font-family="'Inter', sans-serif" font-size="48" font-weight="900" fill="#ef4444" letter-spacing="2">00:08</text>
      <text x="180" y="90" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#f87171">HURRY! +1 Mark</text>

      <!-- Progress bar -->
      <rect x="25" y="125" width="330" height="10" rx="5" fill="#292524" />
      <rect x="25" y="125" width="88" height="10" rx="5" fill="url(#timerWarn)" />
    </g>
  </g>
</svg>
