<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071917" />
      <stop offset="50%" stop-color="#0d2822" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <filter id="glow4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" fill="url(#bgGrad4)" />

  <circle cx="280" cy="420" r="190" fill="#10b981" opacity="0.12" filter="url(#glow4)" />
  <circle cx="920" cy="160" r="210" fill="#06b6d4" opacity="0.12" filter="url(#glow4)" />

  <!-- Left Content Column -->
  <g transform="translate(100, 140)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="230" height="36" rx="18" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.5" />
    <text x="20" y="23" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#6ee7b7">📊 FEATURE HIGHLIGHT 04</text>

    <!-- Headline -->
    <text x="0" y="85" font-family="'Inter', sans-serif" font-size="44" font-weight="800" fill="#ffffff">Teacher Console &amp; Quiz IDs</text>
    <text x="0" y="130" font-family="'Inter', sans-serif" font-size="28" font-weight="700" fill="#10b981">&amp; Real-Time Analytics</text>

    <!-- Description -->
    <text x="0" y="185" font-family="'Inter', sans-serif" font-size="18" fill="#9ca3af">
      <tspan x="0" dy="0">Teachers generate unique shareable Quiz IDs (e.g. QUIZ-XXXXXX),</tspan>
      <tspan x="0" dy="28">schedule assessment windows, monitor participation rates,</tspan>
      <tspan x="0" dy="28">and inspect per-question difficulty statistics instantly.</tspan>
    </text>

    <!-- Feature tags -->
    <g transform="translate(0, 275)">
      <rect x="0" y="0" width="140" height="34" rx="8" fill="#1f2937" stroke="#374151" />
      <text x="16" y="22" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#e5e7eb">🔑 Unique Quiz ID</text>

      <rect x="155" y="0" width="135" height="34" rx="8" fill="#1f2937" stroke="#374151" />
      <text x="171" y="22" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#e5e7eb">📈 Score Graphs</text>

      <rect x="305" y="0" width="135" height="34" rx="8" fill="#1f2937" stroke="#374151" />
      <text x="321" y="22" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#e5e7eb">🕒 Auto Schedule</text>
    </g>
  </g>

  <!-- Right Visual Mockup (Analytics Dashboard Card) -->
  <g transform="translate(680, 80)">
    <rect x="0" y="0" width="440" height="430" rx="20" fill="#111827" stroke="#374151" stroke-width="1.5" />

    <!-- Top ID Badge & Metrics -->
    <g transform="translate(30, 25)">
      <rect x="0" y="0" width="380" height="75" rx="12" fill="#042f2e" stroke="#0d9488" />
      <text x="20" y="28" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#5eead4">ACTIVE QUIZ KEY IDENTIFIER</text>
      <text x="20" y="58" font-family="'Inter', sans-serif" font-size="24" font-weight="900" fill="#ffffff" letter-spacing="2">QUIZ-7F3A21</text>
      <rect x="250" y="22" width="110" height="32" rx="16" fill="#14b8a6" fill-opacity="0.2" stroke="#14b8a6" />
      <text x="305" y="43" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#2dd4bf" text-anchor="middle">PUBLISHED</text>
    </g>

    <!-- Stat mini cards -->
    <g transform="translate(30, 115)">
      <rect x="0" y="0" width="180" height="85" rx="10" fill="#1f2937" />
      <text x="18" y="28" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#9ca3af">Total Submissions</text>
      <text x="18" y="62" font-family="'Inter', sans-serif" font-size="28" font-weight="900" fill="#38bdf8">148</text>

      <rect x="200" y="0" width="180" height="85" rx="10" fill="#1f2937" />
      <text x="218" y="28" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#9ca3af">Average Score</text>
      <text x="218" y="62" font-family="'Inter', sans-serif" font-size="28" font-weight="900" fill="#34d399">78.5%</text>
    </g>

    <!-- Bar chart simulation -->
    <g transform="translate(30, 220)">
      <rect x="0" y="0" width="380" height="175" rx="12" fill="#0f172a" stroke="#1e293b" />
      <text x="20" y="28" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#94a3b8">SCORE DISTRIBUTION BREAKDOWN</text>

      <!-- Bars -->
      <!-- 0-40% -->
      <rect x="35" y="115" width="45" height="30" rx="4" fill="#ef4444" opacity="0.8" />
      <text x="57" y="160" font-family="'Inter', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">&lt;40%</text>
      <!-- 40-60% -->
      <rect x="110" y="90" width="45" height="55" rx="4" fill="#f59e0b" opacity="0.8" />
      <text x="132" y="160" font-family="'Inter', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">40-60%</text>
      <!-- 60-80% -->
      <rect x="185" y="60" width="45" height="85" rx="4" fill="#3b82f6" opacity="0.8" />
      <text x="207" y="160" font-family="'Inter', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">60-80%</text>
      <!-- 80-100% -->
      <rect x="260" y="45" width="45" height="100" rx="4" fill="url(#emeraldGrad)" />
      <text x="282" y="160" font-family="'Inter', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">80-100%</text>
    </g>
  </g>
</svg>
