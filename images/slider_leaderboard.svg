<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140a26" />
      <stop offset="50%" stop-color="#1e1035" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="podiumGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" fill="url(#bgGrad3)" />

  <circle cx="300" cy="180" r="190" fill="#f59e0b" opacity="0.12" filter="url(#glow3)" />
  <circle cx="900" cy="400" r="210" fill="#ec4899" opacity="0.12" filter="url(#glow3)" />

  <!-- Left Content Column -->
  <g transform="translate(100, 140)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="230" height="36" rx="18" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1.5" />
    <text x="20" y="23" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#fcd34d">🏆 FEATURE HIGHLIGHT 03</text>

    <!-- Headline -->
    <text x="0" y="85" font-family="'Inter', sans-serif" font-size="44" font-weight="800" fill="#ffffff">Dynamic Leaderboards</text>
    <text x="0" y="130" font-family="'Inter', sans-serif" font-size="28" font-weight="700" fill="#f59e0b">&amp; Animated Achievements</text>

    <!-- Description -->
    <text x="0" y="185" font-family="'Inter', sans-serif" font-size="18" fill="#9ca3af">
      <tspan x="0" dy="0">Fair tie-breaker ranking logic: Score DESC, Time Taken ASC.</tspan>
      <tspan x="0" dy="28">Celebratory animated trophy cards, medal badges,</tspan>
      <tspan x="0" dy="28">and instant confetti particles for high achievers!</tspan>
    </text>

    <!-- Feature tags -->
    <g transform="translate(0, 275)">
      <rect x="0" y="0" width="135" height="34" rx="8" fill="#1f2937" stroke="#374151" />
      <text x="16" y="22" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#e5e7eb">🥇 Top 3 Podium</text>

      <rect x="150" y="0" width="150" height="34" rx="8" fill="#1f2937" stroke="#374151" />
      <text x="166" y="22" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#e5e7eb">⏱ Time Tie-Breaker</text>

      <rect x="315" y="0" width="125" height="34" rx="8" fill="#1f2937" stroke="#374151" />
      <text x="331" y="22" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#e5e7eb">🎉 Confetti Burst</text>
    </g>
  </g>

  <!-- Right Visual Mockup (Leaderboard Card) -->
  <g transform="translate(680, 80)">
    <rect x="0" y="0" width="440" height="430" rx="20" fill="#111827" stroke="#374151" stroke-width="1.5" />

    <!-- Top Badge Header -->
    <rect x="30" y="25" width="380" height="50" rx="12" fill="#1f2937" />
    <text x="50" y="55" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#e5e7eb">ARENA STANDINGS &amp; RANKS</text>
    <rect x="310" y="35" width="85" height="28" rx="14" fill="#10b981" fill-opacity="0.2" stroke="#10b981" />
    <text x="352" y="53" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#34d399" text-anchor="middle">LIVE SYNC</text>

    <!-- Rank 1 Row (Gold) -->
    <g transform="translate(30, 90)">
      <rect x="0" y="0" width="380" height="65" rx="12" fill="#2d2208" stroke="#f59e0b" stroke-width="1.5" />
      <circle cx="35" cy="32" r="18" fill="url(#goldGrad)" />
      <text x="35" y="38" font-family="'Inter', sans-serif" font-size="15" font-weight="900" fill="#111827" text-anchor="middle">1</text>
      <text x="68" y="28" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#fef08a">Kasun Perera</text>
      <text x="68" y="48" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#9ca3af">IT220905 · 45s taken</text>
      <text x="350" y="38" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#fbbf24" text-anchor="middle">100%</text>
    </g>

    <!-- Rank 2 Row (Silver) -->
    <g transform="translate(30, 168)">
      <rect x="0" y="0" width="380" height="65" rx="12" fill="#1a202c" stroke="#4b5563" stroke-width="1" />
      <circle cx="35" cy="32" r="18" fill="#94a3b8" />
      <text x="35" y="38" font-family="'Inter', sans-serif" font-size="15" font-weight="900" fill="#0f172a" text-anchor="middle">2</text>
      <text x="68" y="28" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#ffffff">Amali Silva</text>
      <text x="68" y="48" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#9ca3af">IT220912 · 52s taken</text>
      <text x="350" y="38" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#e2e8f0" text-anchor="middle">90%</text>
    </g>

    <!-- Rank 3 Row (Bronze) -->
    <g transform="translate(30, 246)">
      <rect x="0" y="0" width="380" height="65" rx="12" fill="#201511" stroke="#78350f" stroke-width="1" />
      <circle cx="35" cy="32" r="18" fill="#d97706" />
      <text x="35" y="38" font-family="'Inter', sans-serif" font-size="15" font-weight="900" fill="#ffffff" text-anchor="middle">3</text>
      <text x="68" y="28" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#fed7aa">Nuwan Bandara</text>
      <text x="68" y="48" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#9ca3af">IT220944 · 58s taken</text>
      <text x="350" y="38" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#fb923c" text-anchor="middle">85%</text>
    </g>

    <!-- Tie-breaker footnote badge -->
    <rect x="30" y="330" width="380" height="70" rx="10" fill="#0f172a" stroke="#1e293b" />
    <text x="45" y="355" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#38bdf8">⚖ Tie-Breaker Algorithm:</text>
    <text x="45" y="375" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">When scores tie, faster completion time ranks higher!</text>
  </g>
</svg>
