<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accentGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="correctGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" fill="url(#bgGrad1)" />

  <!-- Ambient Glow Circles -->
  <circle cx="250" cy="150" r="180" fill="#6366f1" opacity="0.15" filter="url(#glow1)" />
  <circle cx="950" cy="450" r="220" fill="#a855f7" opacity="0.12" filter="url(#glow1)" />

  <!-- Grid overlay -->
  <g stroke="#374151" stroke-width="0.5" opacity="0.25">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="600" />
    <line x1="400" y1="0" x2="400" y2="600" />
    <line x1="600" y1="0" x2="600" y2="600" />
    <line x1="800" y1="0" x2="800" y2="600" />
    <line x1="1000" y1="0" x2="1000" y2="600" />
  </g>

  <!-- Left Content Column -->
  <g transform="translate(100, 140)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="230" height="36" rx="18" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1" stroke-width="1.5" />
    <text x="20" y="23" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#a5b4fc">⚡ FEATURE HIGHLIGHT 01</text>

    <!-- Headline -->
    <text x="0" y="85" font-family="'Inter', sans-serif" font-size="44" font-weight="800" fill="#ffffff">Real-Time MCQ Gameplay</text>
    <text x="0" y="130" font-family="'Inter', sans-serif" font-size="28" font-weight="700" fill="#a855f7">&amp; Instant Feedback</text>

    <!-- Description -->
    <text x="0" y="185" font-family="'Inter', sans-serif" font-size="18" fill="#9ca3af" width="480">
      <tspan x="0" dy="0">Experience game-grade question cards with immediate</tspan>
      <tspan x="0" dy="28">GREEN / RED answer validation, audio feedback triggers,</tspan>
      <tspan x="0" dy="28">and server-side answer locking for academic integrity.</tspan>
    </text>

    <!-- Feature tags -->
    <g transform="translate(0, 275)">
      <rect x="0" y="0" width="130" height="34" rx="8" fill="#1f2937" stroke="#374151" />
      <text x="16" y="22" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#e5e7eb">✔ Instant Green/Red</text>

      <rect x="145" y="0" width="125" height="34" rx="8" fill="#1f2937" stroke="#374151" />
      <text x="161" y="22" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#e5e7eb">🔒 Server Lock</text>

      <rect x="285" y="0" width="140" height="34" rx="8" fill="#1f2937" stroke="#374151" />
      <text x="301" y="22" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#e5e7eb">⚡ Auto Transition</text>
    </g>
  </g>

  <!-- Right Visual Mockup Card -->
  <g transform="translate(680, 90)">
    <!-- Container Card -->
    <rect x="0" y="0" width="440" height="420" rx="20" fill="#111827" stroke="#374151" stroke-width="1.5" />
    <rect x="0" y="0" width="440" height="60" rx="20" fill="#1f2937" opacity="0.6" />

    <!-- Card Header -->
    <circle cx="35" cy="30" r="6" fill="#ef4444" />
    <circle cx="55" cy="30" r="6" fill="#f59e0b" />
    <circle cx="75" cy="30" r="6" fill="#10b981" />
    <text x="180" y="36" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#9ca3af" text-anchor="middle">QUESTION 02 OF 05</text>
    <rect x="330" y="16" width="85" height="28" rx="14" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" />
    <text x="372" y="34" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#f87171" text-anchor="middle">00:14s</text>

    <!-- Question Body -->
    <text x="30" y="105" font-family="'Inter', sans-serif" font-size="17" font-weight="700" fill="#f3f4f6">What is the primary key in a relational</text>
    <text x="30" y="130" font-family="'Inter', sans-serif" font-size="17" font-weight="700" fill="#f3f4f6">database table used for?</text>

    <!-- Option A (Neutral) -->
    <rect x="30" y="160" width="380" height="50" rx="10" fill="#1f2937" stroke="#374151" stroke-width="1" />
    <text x="50" y="191" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#9ca3af">A. Storing duplicate row values</text>

    <!-- Option B (Correct - Green Glowing) -->
    <rect x="30" y="222" width="380" height="50" rx="10" fill="url(#correctGrad)" fill-opacity="0.2" stroke="#10b981" stroke-width="2" />
    <text x="50" y="253" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#34d399">B. Uniquely identifying each record</text>
    <circle cx="385" cy="247" r="12" fill="#10b981" />
    <path d="M379 247 l4 4 l8 -8" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" />

    <!-- Option C (Wrong - Red) -->
    <rect x="30" y="284" width="380" height="50" rx="10" fill="#1f2937" stroke="#374151" stroke-width="1" />
    <text x="50" y="315" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#9ca3af">C. Automatically sorting rows alphabetically</text>

    <!-- Option D (Neutral) -->
    <rect x="30" y="346" width="380" height="50" rx="10" fill="#1f2937" stroke="#374151" stroke-width="1" />
    <text x="50" y="377" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#9ca3af">D. Creating temporary index partitions</text>
  </g>
</svg>
