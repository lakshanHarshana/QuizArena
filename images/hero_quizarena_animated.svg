<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 550" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="arenaCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="arenaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="coreGlowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <style>
      /* Smooth CSS Keyframe Animations */
      @keyframes floatArena {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-12px); }
      }
      @keyframes spinClockwise {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spinCounterClockwise {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes pulseAura {
        0%, 100% { transform: scale(1); opacity: 0.35; }
        50% { transform: scale(1.18); opacity: 0.65; }
      }
      @keyframes pulseCore {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.06); }
      }
      @keyframes orbitParticle1 {
        0% { transform: rotate(0deg) translateX(190px) rotate(0deg); }
        100% { transform: rotate(360deg) translateX(190px) rotate(-360deg); }
      }
      @keyframes orbitParticle2 {
        0% { transform: rotate(180deg) translateX(190px) rotate(-180deg); }
        100% { transform: rotate(540deg) translateX(190px) rotate(-540deg); }
      }
      @keyframes badgeFloat1 {
        0%, 100% { transform: translateY(0px) rotate(-2deg); }
        50% { transform: translateY(-8px) rotate(2deg); }
      }
      @keyframes badgeFloat2 {
        0%, 100% { transform: translateY(0px) rotate(2deg); }
        50% { transform: translateY(-10px) rotate(-2deg); }
      }
      @keyframes timerTick {
        0%, 100% { stroke-dashoffset: 60; }
        50% { stroke-dashoffset: 240; }
      }
      @keyframes lightningFlash {
        0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 6px #fbbf24); }
        50% { opacity: 1; filter: drop-shadow(0 0 16px #f59e0b); }
      }

      .arena-master-group {
        animation: floatArena 4s ease-in-out infinite;
      }
      .ring-cw {
        transform-origin: 300px 250px;
        animation: spinClockwise 24s linear infinite;
      }
      .ring-ccw {
        transform-origin: 300px 250px;
        animation: spinCounterClockwise 18s linear infinite;
      }
      .aura-glow {
        transform-origin: 300px 250px;
        animation: pulseAura 3s ease-in-out infinite;
      }
      .arena-center {
        transform-origin: 300px 250px;
        animation: pulseCore 3.5s ease-in-out infinite;
      }
      .orbiting-1 {
        transform-origin: 300px 250px;
        animation: orbitParticle1 12s linear infinite;
      }
      .orbiting-2 {
        transform-origin: 300px 250px;
        animation: orbitParticle2 12s linear infinite;
      }
      .badge-orbit-left {
        animation: badgeFloat1 3.2s ease-in-out infinite;
      }
      .badge-orbit-right {
        animation: badgeFloat2 3.6s ease-in-out infinite 0.5s;
      }
      .timer-progress-ring {
        animation: timerTick 6s ease-in-out infinite alternate;
      }
      .lightning-glow {
        animation: lightningFlash 2s ease-in-out infinite alternate;
      }
    </style>
  </defs>

  <!-- Ambient Glow Background -->
  <circle cx="300" cy="250" r="240" fill="url(#arenaGlow)" class="aura-glow" />

  <g class="arena-master-group">
    <!-- Outer Gyroscope Orbital Ring (Clockwise) -->
    <g class="ring-cw">
      <circle cx="300" cy="250" r="215" fill="none" stroke="url(#beamGrad)" stroke-width="2.5" stroke-dasharray="16 12 40 12" />
      <circle cx="515" cy="250" r="4.5" fill="#38bdf8" filter="url(#coreGlowFilter)" />
      <circle cx="85" cy="250" r="4.5" fill="#a855f7" filter="url(#coreGlowFilter)" />
    </g>

    <!-- Middle Concentric Tech Ring (Counter-Clockwise) -->
    <g class="ring-ccw">
      <circle cx="300" cy="250" r="175" fill="none" stroke="#6366f1" stroke-width="1.8" stroke-dasharray="8 8 20 8" stroke-opacity="0.6" />
      <circle cx="300" cy="75" r="4" fill="#fbbf24" filter="url(#coreGlowFilter)" />
      <circle cx="300" cy="425" r="4" fill="#10b981" filter="url(#coreGlowFilter)" />
    </g>

    <!-- Orbiting Energy Spark Nodes -->
    <g class="orbiting-1">
      <circle cx="300" cy="250" r="5" fill="#60a5fa" filter="url(#coreGlowFilter)" />
    </g>
    <g class="orbiting-2">
      <circle cx="300" cy="250" r="5" fill="#f43f5e" filter="url(#coreGlowFilter)" />
    </g>

    <!-- Central Arena Combat / Quiz Shield Platform -->
    <g class="arena-center" filter="url(#softShadow)">
      <!-- Octagonal Arena Shield Outer Ring -->
      <polygon points="300,120 395,158 430,250 395,342 300,380 205,342 170,250 205,158" 
               fill="url(#shieldGrad)" stroke="#6366f1" stroke-width="3" />

      <!-- Inner Glowing Geometric Accent -->
      <polygon points="300,135 382,168 412,250 382,332 300,365 218,332 188,250 218,168" 
               fill="#090d16" fill-opacity="0.75" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="6 4" />

      <!-- Timer Radial Ring in Center Arena -->
      <circle cx="300" cy="250" r="82" fill="none" stroke="#334155" stroke-width="6" />
      <circle cx="300" cy="250" r="82" fill="none" stroke="url(#arenaCoreGrad)" stroke-width="6" 
              stroke-linecap="round" stroke-dasharray="515" stroke-dashoffset="120" class="timer-progress-ring" />

      <!-- Inner Trophy & Lightning Emblem -->
      <g transform="translate(300, 250)">
        <!-- Trophy Cup Base -->
        <path d="M-28,-32 L28,-32 C28,0 18,22 0,28 C-18,22 -28,0 -28,-32 Z" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" />
        <!-- Trophy Handles -->
        <path d="M-28,-22 C-40,-22 -40,5 -22,8" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" />
        <path d="M28,-22 C40,-22 40,5 22,8" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" />
        <!-- Trophy Stem & Pedestal -->
        <path d="M-6,28 L6,28 L8,40 L-8,40 Z" fill="#6366f1" />
        <rect x="-18" y="40" width="36" height="8" rx="3" fill="#818cf8" />
        <!-- Lightning Bolt at Heart of Trophy -->
        <polygon points="2,-24 -12,-4 0,-4 -2,16 12,-4 0,-4" fill="#fbbf24" class="lightning-glow" />
      </g>
    </g>

    <!-- Floating Satellite Badge 1: Real-Time Timer (Top Right) -->
    <g class="badge-orbit-right" transform="translate(390, 85)" filter="url(#softShadow)">
      <rect x="0" y="0" width="165" height="58" rx="14" fill="#111827" stroke="#10b981" stroke-width="1.5" fill-opacity="0.95" />
      <circle cx="28" cy="29" r="14" fill="#10b981" fill-opacity="0.2" />
      <path d="M28,21 L28,29 L34,29" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
      <circle cx="28" cy="29" r="11" fill="none" stroke="#10b981" stroke-width="1.5" />
      <text x="50" y="24" font-family="'Inter', -apple-system, sans-serif" font-size="10" font-weight="700" fill="#9ca3af" letter-spacing="0.5">AUTO TIMER</text>
      <text x="50" y="44" font-family="'Courier New', monospace" font-size="15" font-weight="800" fill="#34d399">00:30s SYNC</text>
    </g>

    <!-- Floating Satellite Badge 2: Dynamic Leaderboard / Points (Bottom Left) -->
    <g class="badge-orbit-left" transform="translate(45, 360)" filter="url(#softShadow)">
      <rect x="0" y="0" width="175" height="60" rx="14" fill="#111827" stroke="#6366f1" stroke-width="1.5" fill-opacity="0.95" />
      <circle cx="28" cy="30" r="14" fill="#6366f1" fill-opacity="0.2" />
      <!-- Star Icon -->
      <polygon points="28,20 31,26 38,27 33,32 34,39 28,35 22,39 23,32 18,27 25,26" fill="#fbbf24" />
      <text x="50" y="25" font-family="'Inter', -apple-system, sans-serif" font-size="10" font-weight="700" fill="#9ca3af" letter-spacing="0.5">LEADERBOARD</text>
      <text x="50" y="46" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="800" fill="#ffffff">Rank #1 <tspan fill="#a855f7" font-size="12">+100 Pts</tspan></text>
    </g>

    <!-- Floating Satellite Badge 3: Instant Answer Validation (Bottom Right) -->
    <g class="badge-orbit-right" transform="translate(380, 395)" filter="url(#softShadow)">
      <rect x="0" y="0" width="168" height="52" rx="14" fill="#111827" stroke="#ec4899" stroke-width="1.5" fill-opacity="0.95" />
      <circle cx="26" cy="26" r="12" fill="#ec4899" fill-opacity="0.2" />
      <!-- Checkmark -->
      <path d="M21,26 L25,30 L32,22" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <text x="46" y="22" font-family="'Inter', -apple-system, sans-serif" font-size="10" font-weight="700" fill="#9ca3af" letter-spacing="0.5">MCQ FEEDBACK</text>
      <text x="46" y="40" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="700" fill="#f43f5e">Instant Locked ✓</text>
    </g>
  </g>
</svg>
